name: Sync V2EX job signals

on:
  schedule:
    - cron: "15 1,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-v2ex-jobs
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Fetch and normalize public job signals
        run: |
          node scripts/sync-v2ex-jobs.mjs
          node scripts/sync-funplus-jobs.mjs
          node scripts/sync-tianzong-jobs.mjs
          node scripts/sync-neowiz-jobs.mjs
          node scripts/sync-moka-game-jobs.mjs
          node scripts/sync-habby-jobs.mjs
      - name: Commit feed changes
        run: |
          if git diff --quiet -- data/v2ex-jobs.json data/funplus-jobs.json data/tianzong-jobs.json data/neowiz-jobs.json data/moka-*-jobs.json data/habby-jobs.json; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v2ex-jobs.json data/funplus-jobs.json data/tianzong-jobs.json data/neowiz-jobs.json data/moka-*-jobs.json data/habby-jobs.json
          git commit -m "chore(data): refresh public job feeds"
          git push
