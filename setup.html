<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>职得｜电脑端求职档案</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#202231;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.hero{padding:36px max(22px,calc((100vw - 920px)/2));background:linear-gradient(145deg,#eeeaff,#fff)}.logo{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800}.logo i{width:46px;height:46px;border-radius:15px;background:#5b55e7;color:#fff;display:grid;place-items:center;font-style:normal}.hero small{display:block;color:#5b55e7;font-weight:800;margin-top:54px}.hero h1{font-size:46px;line-height:1.22;margin:14px 0}.hero p{color:#737a89;line-height:1.7}.content{width:min(900px,calc(100% - 36px));margin:28px auto 64px}.card{background:#fff;border-radius:22px;padding:26px;margin-bottom:18px;box-shadow:0 10px 35px rgba(40,43,73,.05)}.head{display:flex;justify-content:space-between}.head h2{margin:0 0 6px}.head p,.card>p{margin:0;color:#858b99;font-size:14px}.count,.status{color:#514bd3;background:#eeedff;border-radius:999px;padding:6px 10px;height:max-content}.status.linked{color:#16764a;background:#e8f8f0}.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.chips button{border:0;border-radius:999px;background:#f0f1f5;padding:10px 15px;cursor:pointer}.chips button.on{background:#5b55e7;color:#fff;font-weight:700}select,textarea,input[type=file]{width:100%;border:1px solid #e1e3e9;border-radius:14px;background:#fafafd;font:inherit;margin-top:18px}select{height:52px;padding:0 14px}textarea{min-height:190px;padding:14px;line-height:1.6;resize:vertical}input[type=file]{padding:15px}.consent{display:flex;gap:9px;align-items:flex-start;color:#666d7b;font-size:14px;line-height:1.6;margin:24px 5px}.submit{width:100%;height:58px;border:0;border-radius:999px;background:#5b55e7;color:#fff;font-size:17px;font-weight:800;cursor:pointer}.submit:disabled{opacity:.55}.error,.success,.notice{padding:14px;border-radius:13px;margin-bottom:14px}.error{background:#fff0f0;color:#a93636}.success{background:#eaf8f1;color:#176c48}.notice{background:#fff8e7;color:#7c6221}.result{text-align:center;background:#fff;border-radius:28px;padding:40px;max-width:700px;margin:50px auto}.result h1{font-size:64px;letter-spacing:8px}.result button{border:0;border-radius:999px;background:#5b55e7;color:#fff;padding:13px 24px}.resume-actions{display:flex;gap:12px;align-items:center}.resume-actions button{margin-top:18px;min-width:150px;height:48px;border:0;border-radius:999px;background:#eeedff;color:#514bd3;font-weight:700}.privacy{font-size:13px;color:#858b99;line-height:1.6}@media(max-width:620px){.hero h1{font-size:35px}.result h1{font-size:44px;letter-spacing:4px}.resume-actions{display:block}}
  </style>
</head>
<body>
  <header class="hero"><div class="logo"><i>职</i>职得</div><small>电脑端建档与同步 · 约 5 分钟</small><h1>在大屏幕上完成资料，<br>回到微信继续求职。</h1><p>首次使用 8 位一次性验证码确认是你本人。绑定后，这台浏览器可以继续更新资料；验证码用后立即失效。</p></header>
  <main class="content" id="form"></main>
  <script>
    const API="https://cloud1-d1gpc53cw18f7de97-1460110390.ap-shanghai.app.tcloudbase.com/pairingApi";
    const RESUME_API="https://cloud1-d1gpc53cw18f7de97-1460110390.ap-shanghai.app.tcloudbase.com/webResumeApi";
    const groups=[
      ["industries","期望行业","最多 3 个",3,["互联网/软件","游戏","人工智能","广告/传媒","消费品/零售","电商","跨境电商","金融","教育培训","医疗健康","制造业","新能源","汽车","电子/半导体","建筑/地产","物流/运输","旅游/酒店","专业服务/咨询","政府/公共事业","其他"]],
      ["roles","期望职位","最多 5 个",5,["产品经理","项目经理","产品运营","用户运营","内容运营","市场营销","品牌营销","海外市场","增长营销","广告投放","公关传播","游戏发行","销售","商务拓展","电商运营","跨境电商运营","文案策划","广告创意","UI/UX设计","数据分析","软件开发","测试工程师","算法工程师","人力资源","财务","行政","法务","教师/教研","咨询顾问","其他"]],
      ["cities","工作地点","最多 5 个",5,["北京","上海","广州","深圳","杭州","成都","武汉","南京","苏州","重庆","西安","长沙","天津","青岛","厦门","郑州","合肥","宁波","香港","澳门","海外","远程","其他"]]
    ];
    const randomHex=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),v=>v.toString(16).padStart(2,"0")).join("");
    const deviceId=localStorage.zhideDeviceId||(localStorage.zhideDeviceId=crypto.randomUUID?crypto.randomUUID():randomHex(16));
    const deviceSecret=localStorage.zhideDeviceSecret||(localStorage.zhideDeviceSecret=randomHex(32));
    const state={industries:[],roles:[],cities:[],years:"",resumeText:"",agreed:false,linked:false,profileUpdatedAt:0};
    const root=document.querySelector("#form");
    const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    function capture(){
      const years=document.querySelector("#years"),resume=document.querySelector("#resume"),agree=document.querySelector("#agree");
      if(years)state.years=years.value;if(resume)state.resumeText=resume.value;if(agree)state.agreed=agree.checked;
    }
    function draw(message=""){
      root.innerHTML=`<section class="card"><div class="head"><div><h2>同步状态</h2><p>${state.linked?"已绑定当前微信，可从网页和小程序更新同一份资料。":"尚未绑定。填写后会生成一次性验证码。"}</p></div><span class="status ${state.linked?"linked":""}">${state.linked?"✓ 已绑定":"待绑定"}</span></div></section>`+
      groups.map(([key,title,hint,max,options])=>`<section class="card"><div class="head"><div><h2>${title}</h2><p>${hint}</p></div><span class="count">${state[key].length}/${max}</span></div><div class="chips">${options.map(v=>`<button type="button" data-key="${key}" data-max="${max}" data-value="${v}" class="${state[key].includes(v)?"on":""}">${v}</button>`).join("")}</div></section>`).join("")+`
      <section class="card"><h2>工作年限</h2><select id="years"><option value="">请选择</option>${["应届生","1年以内","1-3年","3-5年","5-10年","10年以上"].map(v=>`<option ${state.years===v?"selected":""}>${v}</option>`).join("")}</select></section>
      <section class="card"><h2>简历</h2><p>${state.linked?"可上传 PDF / DOCX 自动解析，或直接粘贴正文。上传只用于个人画像与匹配。":"首次绑定前可先粘贴正文；PDF / DOCX 上传会在绑定后启用。"}</p>
        <input id="resumeFile" type="file" accept=".pdf,.docx" ${state.linked?"":"disabled"}>
        <div class="resume-actions"><button id="uploadResume" ${state.linked?"":"disabled"}>上传并解析</button><span id="fileStatus" class="privacy">单个文件不超过 4MB；扫描版 PDF 请粘贴文字。</span></div>
        <textarea id="resume" placeholder="也可以在这里粘贴简历正文，建议至少 50 字">${esc(state.resumeText)}</textarea>
        <p class="privacy">原文件仅在解析请求中临时处理；账号中保存提取后的文字与分析结果，不会自动发送给企业。</p>
      </section>
      <label class="consent"><input id="agree" type="checkbox" ${state.agreed?"checked":""}>我同意将以上资料用于个人岗位匹配，并同步至我绑定的职得小程序；不会自动发送给企业。</label>
      <div id="error">${message}</div><button class="submit" id="submit">${state.linked?"保存并同步到小程序":"生成小程序绑定码"}</button>`;
      document.querySelectorAll("[data-key]").forEach(btn=>btn.onclick=()=>{capture();const a=state[btn.dataset.key],v=btn.dataset.value,max=+btn.dataset.max;if(a.includes(v))a.splice(a.indexOf(v),1);else if(a.length<max)a.push(v);draw()});
      document.querySelector("#submit").onclick=save;
      document.querySelector("#uploadResume").onclick=uploadResume;
    }
    async function callApi(payload){
      const response=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...payload,deviceId,deviceSecret})});
      const result=await response.json();if(!result.ok)throw new Error(result.error||"操作失败");return result;
    }
    function profile(){
      capture();return {industries:state.industries,roles:state.roles,cities:state.cities,years:state.years,resumeText:state.resumeText.trim()||undefined};
    }
    async function save(){
      const data=profile(),error=document.querySelector("#error");
      if(!data.industries.length||!data.roles.length||!data.cities.length||!data.years||!state.agreed){error.innerHTML='<div class="error">请完整选择行业、职位、城市和年限，并勾选资料使用说明。</div>';return}
      document.querySelector("#submit").textContent=state.linked?"正在同步…":"正在生成…";
      try{
        if(state.linked){const result=await callApi({action:"webSave",profile:data});state.profileUpdatedAt=result.profileUpdatedAt;draw('<div class="success">✓ 已同步。打开小程序“我的”页面即可检查新资料。</div>');return}
        const result=await callApi({action:"create",profile:data});
        root.innerHTML=`<section class="result"><small>网页建档已完成</small><h1>${result.code.slice(0,4)} ${result.code.slice(4)}</h1><p>打开职得小程序，点击“已有网页绑定码”并输入这 8 位数字。绑定码 10 分钟内有效且只能使用一次。</p><button id="copy">复制绑定码</button><p class="privacy">绑定完成后刷新本页，即可继续上传简历或同步资料。</p></section>`;
        document.querySelector("#copy").onclick=()=>navigator.clipboard.writeText(result.code);
        scrollTo({top:0,behavior:"smooth"});
      }catch(e){error.innerHTML=`<div class="error">${esc(e.message)}</div>`;document.querySelector("#submit").textContent=state.linked?"重新同步":"重新生成"}
    }
    async function uploadResume(){
      capture();const file=document.querySelector("#resumeFile").files[0],status=document.querySelector("#fileStatus");
      if(!file){status.textContent="请先选择 PDF 或 DOCX 文件";return}
      const extension=(file.name.split(".").pop()||"").toLowerCase();
      if(!["pdf","docx"].includes(extension)||file.size>4*1024*1024){status.textContent="请选择不超过 4MB 的 PDF 或 DOCX";return}
      status.textContent="正在读取并安全解析…";document.querySelector("#uploadResume").disabled=true;
      try{
        const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(",")[1]);reader.onerror=reject;reader.readAsDataURL(file)});
        const response=await fetch(RESUME_API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({deviceId,deviceSecret,fileName:file.name,extension,base64})});
        const result=await response.json();if(!result.ok)throw new Error(result.error||"解析失败");
        state.resumeText=result.text;state.profileUpdatedAt=result.profileUpdatedAt;draw(`<div class="success">✓ ${esc(file.name)} 已解析并同步，提取 ${result.analysis.characterCount} 字、识别 ${result.analysis.skills.length} 项能力。</div>`);
      }catch(e){status.textContent=e.message||"解析失败";document.querySelector("#uploadResume").disabled=false}
    }
    async function init(){
      draw('<div class="notice">正在检查当前浏览器的绑定状态…</div>');
      try{
        const result=await callApi({action:"webStatus"});
        state.linked=Boolean(result.linked);state.profileUpdatedAt=result.profileUpdatedAt||0;
        if(result.profile){["industries","roles","cities"].forEach(k=>state[k]=result.profile[k]||[]);state.years=result.profile.years||"";state.resumeText=result.profile.resumeText||"";state.agreed=true}
        draw(state.linked?'<div class="success">✓ 已恢复当前浏览器与微信的安全关联。</div>':"");
      }catch(e){draw(`<div class="error">状态检查失败：${esc(e.message)}</div>`)}
    }
    init();
  </script>
</body>
</html>
